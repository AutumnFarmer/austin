# Cursor Cloud Agent environment profile.
# Points austin-web at the local Docker MySQL 5.7 / Redis started by the environment,
# uses the single-machine eventBus queue, and disables optional middleware
# (kafka/rocketmq/rabbitmq/xxl-job/apollo/nacos/graylog) so the app boots standalone.
server.port=7777

# [database] local docker MySQL 5.7
austin.database.ip=127.0.0.1
austin.database.port=3306
austin.database.username=root
austin.database.password=root123_A

# [redis] local docker Redis
austin.redis.ip=127.0.0.1
austin.redis.port=6379
austin.redis.password=austin

# choose : kafka/eventBus/rocketMq/rabbitMq, default eventBus (single machine, no external MQ)
austin.mq.pipeline=eventBus

# [kafka] optional - not used when pipeline=eventBus, kept resolvable
austin.kafka.ip=127.0.0.1
austin.kafka.port=9092

# [rocketMq] optional
austin.rocketmq.nameserver.ip=
austin.rocketmq.nameserver.port=

# [rabbitMq] optional
austin.rabbitmq.ip=
austin.rabbitmq.port=

# [xxl-job] disabled
austin.xxl.job.enabled=false
austin.xxl.job.ip=127.0.0.1
austin.xxl.job.port=8080

# apollo/nacos disabled -> business config read from local.properties
austin.apollo.enabled=false
austin.nacos.enabled=false

# [grayLog] optional
austin.grayLog.ip=127.0.0.1

# upload path for crowd files
austin.business.upload.crowd.path=/tmp

# official account login disabled (login config bean only loads under 'test' profile anyway)
austin.login.official.account.enable=false
austin.login.official.account.appId=
austin.login.official.account.secret=
austin.login.official.account.token=austin123
